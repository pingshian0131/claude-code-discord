# Claude Code Discord Bot - Docker Compose Configuration
# Quick start: docker compose up -d

services:
  claude-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-code-discord
    restart: unless-stopped
    
    # Environment variables (use .env file or set here)
    env_file:
      - ./.env
    environment:
      - WORK_DIR=/app/workspace
    
    # Volume mounts for persistence and workspace access
    volumes:
      # Persist bot data (todos, sessions, etc.)
      - bot-data:/app/.bot-data
      # Optional: Mount your local workspace for Claude to work on
      # Uncomment and modify path as needed:
      - /home/ubuntu-beelink/Documents/projects/panamera_python3:/app/workspace
      # Mount host Claude credentials for authentication
      - /home/ubuntu-beelink/.claude:/home/claude/.claude
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Network mode
    networks:
      - claude-network

# Named volumes for data persistence
volumes:
  bot-data:
    driver: local

# Network configuration
networks:
  claude-network:
    driver: bridge
